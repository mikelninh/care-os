name: recare-capstone

on:
  push:
    branches: [main]
    paths:
      - 'app/recare_*.py'
      - 'app/agent_*.py'
      - 'scripts/aggregate_recare_study.py'
      - 'tests/test_recare_*.py'
      - 'tests/test_agent_model_adapter.py'
      - 'tests/test_agent_orchestrator.py'
      - 'tests/test_agent_phase1.py'
      - 'requirements.lock'
      - '.github/workflows/recare-capstone.yml'
  pull_request:
    paths:
      - 'app/recare_*.py'
      - 'app/agent_*.py'
      - 'scripts/aggregate_recare_study.py'
      - 'tests/test_recare_*.py'
      - 'tests/test_agent_model_adapter.py'
      - 'tests/test_agent_orchestrator.py'
      - 'tests/test_agent_phase1.py'
      - 'requirements.lock'
      - '.github/workflows/recare-capstone.yml'

permissions:
  contents: read

jobs:
  capstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - run: python -m pip install --upgrade pip
      - name: Install locked dependencies
        run: pip install --requirement requirements.lock
      - name: Run focused Recare agent, API, model-gateway and study tests
        run: >-
          pytest -q
          tests/test_recare_capstone.py
          tests/test_recare_api.py
          tests/test_recare_study_aggregation.py
          tests/test_agent_model_adapter.py
          tests/test_agent_orchestrator.py
          tests/test_agent_phase1.py
      - name: Smoke-test six-case containment suite
        run: >-
          python -c "from app.recare_eval_suite import run_recare_eval_suite;
          s=run_recare_eval_suite(); print(s);
          assert s['all_pass'] and s['passed'] == s['total'] == 6"
