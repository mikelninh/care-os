<rect x="980" y="185" width="405" height="314" rx="22" fill="#fff" stroke="#e0e7e4" filter="url(#s)"/><text x="1008" y="225" class="label muted">OFFEN</text><text x="1008" y="258" class="h2">Was das Team nachhalten muss</text><g class="body"><text x="1010" y="302">✓ Finales Resistogramm Blutkultur</text><text x="1010" y="340">✓ Kontroll-Blutkultur nach Therapiebeginn</text><text x="1010" y="378">✓ MRGN-Screening</text><text x="1010" y="416">✓ Entscheidung über ZVK klinisch prüfen</text></g>
<rect x="980" y="520" width="405" height="190" rx="22" fill="#fff" stroke="#e0e7e4" filter="url(#s)"/><text x="1008" y="558" class="label muted">ÜBERGABE</text><text x="1008" y="592" class="h2">Ein Blick statt Telefonkette</text><text x="1008" y="626" class="body">E. coli-Bakteriämie · vorläufig Ceftriaxon S,</text><text x="1008" y="650" class="body">Ciprofloxacin R. Finale Empfindlichkeit und</text><text x="1008" y="674" class="body">MRGN-Screening ausstehend. Kontaktmaßnahmen aktiv.</text>
<rect x="980" y="732" width="405" height="108" rx="22" fill="#ecf7f3"/><text x="1008" y="768" class="label" fill="#397a65">EVIDENZ-LAYER</text><text x="1008" y="799" class="body">RKI/KRINKO · AWMF · lokale SOP</text><text x="1008" y="823" class="small muted">Neue Version → klinische Review, nie stille Änderung.</text>
