<rect x="55" y="185" width="900" height="655" rx="22" fill="#fff" stroke="#e0e7e4" filter="url(#s)"/><text x="86" y="225" class="h2">Mara Novak</text><text x="86" y="252" class="small muted">12.06.1987 · INF-20491 · Infektiologie · Station I2 · Zimmer I2-11</text><rect x="776" y="209" width="146" height="28" rx="14" fill="#ebf7f3"/><text x="803" y="228" fill="#387c68" class="small" font-weight="700">Quellen sichtbar</text>
<text x="86" y="302" class="label muted">JETZT RELEVANT</text><text x="86" y="338" font-size="26" font-weight="740">Was ändert heute die infektiologische Entscheidung?</text>
<g><rect x="86" y="368" width="400" height="122" rx="16" fill="#fff7f6" stroke="#ead1cd"/><text x="108" y="396" class="label" fill="#a84940">MIKROBIOLOGIE</text><text x="108" y="427" class="h2">Blutkultur: E. coli · 2/2 positiv</text><text x="108" y="454" class="small muted">Mikrobiologie · heute 06:42</text><text x="108" y="476" class="small">Resistogramm teilweise verfügbar</text></g>
<g><rect x="506" y="368" width="400" height="122" rx="16" fill="#fffaf0" stroke="#ebd8ad"/><text x="528" y="396" class="label" fill="#9b7021">RESISTENZ</text><text x="528" y="427" class="h2">Ciprofloxacin: R · Ceftriaxon: S</text><text x="528" y="454" class="small muted">Mikrobiologie · heute 07:05</text><text x="528" y="476" class="small">Finale Empfindlichkeit ausstehend</text></g>
<g><rect x="86" y="506" width="400" height="122" rx="16" fill="#f5fafc" stroke="#d6e6ec"/><text x="108" y="534" class="label" fill="#39778e">ANTIINFEKTIVA</text><text x="108" y="565" class="h2">Ceftriaxon 2 g i.v. 1×/Tag</text><text x="108" y="592" class="small muted">KIS Medikation · seit gestern 19:10</text><text x="108" y="614" class="small">Dokumentiert · keine Auto-Empfehlung</text></g>
<g><rect x="506" y="506" width="400" height="122" rx="16" fill="#fffaf0" stroke="#ebd8ad"/><text x="528" y="534" class="label" fill="#9b7021">HYGIENE</text><text x="528" y="565" class="h2">Kontaktmaßnahmen aktiv</text><text x="528" y="592" class="small muted">Bis MRGN-Screening geklärt ist</text><text x="528" y="614" class="small">Lokale SOP verknüpft</text></g>
<g><rect x="86" y="644" width="400" height="122" rx="16" fill="#f5fafc" stroke="#d6e6ec"/><text x="108" y="672" class="label" fill="#39778e">DEVICE</text><text x="108" y="703" class="h2">ZVK seit 4 Tagen</text><text x="108" y="730" class="small muted">Pflege/KIS · Anlage 11.08.</text><text x="108" y="752" class="small">Quelle erhalten</text></g>
