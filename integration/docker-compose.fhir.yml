services:
  fhir:
    image: hapiproject/hapi:latest
    container_name: careos-hapi-fhir
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.default_encoding: json
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 12
