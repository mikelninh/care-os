{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-careos-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: careos
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  # Egress is intentionally empty. Hospital-specific overlays must explicitly admit
  # only required KIS/LIS/FHIR, IdP, audit and approved provider destinations.
  egress: []
{{- end }}
