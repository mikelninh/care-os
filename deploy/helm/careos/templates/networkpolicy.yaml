{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-careos-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: careos
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  # Egress is intentionally empty here. A hospital-specific values/policy overlay must
  # explicitly admit required FHIR/KIS/LIS, IdP, audit and approved model endpoints.
  egress: []
{{- end }}
