{{- $manifestConfigMap := default (printf "%s-careos-manifest" .Release.Name) .Values.hospital.existingManifestConfigMap }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-careos
  labels:
    app.kubernetes.io/name: careos
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: careos
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: careos
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: careos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["app.hospital_api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          env:
            - name: CAREOS_HOSPITAL_MANIFEST
              value: /etc/careos/hospital.json
            - name: CAREOS_DATA_MODE
              value: {{ .Values.careos.dataMode | quote }}
            - name: FHIR_BASE_URL
              value: {{ .Values.careos.fhirBaseUrl | quote }}
            - name: CAREOS_EXTERNAL_DEIDENTIFIED_ACK
              value: {{ .Values.careos.externalDeidentifiedAck | quote }}
{{- if .Values.hospital.runtimeSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.hospital.runtimeSecretName | quote }}
{{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hospital-manifest
              mountPath: /etc/careos/hospital.json
              subPath: hospital.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: hospital-manifest
          configMap:
            name: {{ $manifestConfigMap }}
